# Codacy Security Scan: runs the Codacy Analysis CLI (static analysis and security tools)
# and uploads the results to the Security tab (Code scanning). Without a Codacy project
# token it runs the default tool set locally in the runner; with the repository secret
# CODACY_PROJECT_TOKEN it uses the configuration of the project on codacy.com.
name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues to fit GitHub Code Scanning.
          gh-code-scanning-compat: true
          # Never fail the build on findings; they are reviewed in the Security tab.
          max-allowed-issues: 2147483647

      # Codacy writes one SARIF run per tool into a single file, but code scanning accepts only one run per
      # category. Split it into one file per run, each with its own category (automationDetails.id). A tool can
      # appear more than once (e.g. opengrep for several languages): later runs get -2, -3, ...
      # Pure style and documentation linters are uploaded with an empty result list: they are not security
      # findings and buried the real ones (over a thousand Markdown line-length and naming notes). Keeping their
      # category with no results closes the alerts they raised before.
      - name: Split SARIF per tool
        run: |
          python3 - <<'PY'
          import json, os, re
          STYLE_ONLY = {'markdownlint', 'remark-lint', 'agentlinter', 'deadcode', 'revive', 'pylint',
                        'pylintpython3', 'prospector'}
          data = json.load(open('results.sarif', encoding='utf-8'))
          os.makedirs('sarif', exist_ok=True)
          seen = {}
          for index, run in enumerate(data.get('runs', [])):
              tool = run.get('tool', {}).get('driver', {}).get('name') or f'tool{index}'
              if tool.split(' ')[0].lower() in STYLE_ONLY:
                  run['results'] = []
              slug = re.sub(r'[^A-Za-z0-9_-]+', '-', tool).strip('-').lower() or f'tool{index}'
              seen[slug] = seen.get(slug, 0) + 1
              category = slug if seen[slug] == 1 else f'{slug}-{seen[slug]}'
              run['automationDetails'] = {'id': f'codacy-{category}/'}
              part = dict(data, runs=[run])
              json.dump(part, open(f'sarif/{index:02d}-{category}.sarif', 'w', encoding='utf-8'))
              print(f'{category}: {len(run.get("results", []))} results')
          PY

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: sarif
